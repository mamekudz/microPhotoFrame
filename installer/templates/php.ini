[PHP]
extension_dir="@PHP@/ext"
extension=zip
extension=mbstring
extension=gd
extension=fileinfo
extension=openssl
extension=curl
upload_max_filesize=500M
post_max_size=500M
memory_limit=512M
max_execution_time=3600
max_input_time=3600
date.timezone=UTC
display_errors=Off
log_errors=On
error_log="@ROOT@/logs/php-error.log"
upload_tmp_dir="@ROOT@/temp"
sys_temp_dir="@ROOT@/temp"
session.save_path="@ROOT@/temp"
cgi.force_redirect=0
expose_php=Off
