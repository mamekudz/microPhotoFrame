ServerRoot "@RUNTIME@/apache"
Listen @PORT@
ServerName localhost
LoadModule mpm_winnt_module modules/mod_mpm_winnt.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule php_module "@RUNTIME@/php-ts/php8apache2_4.dll"
PHPIniDir "@RUNTIME@/php-ts"
DocumentRoot "@ROOT@"
ErrorLog "@ROOT@/logs/apache-error.log"
CustomLog "@ROOT@/logs/apache-access.log" common
TypesConfig conf/mime.types
AddType application/javascript .mjs
<Directory "@ROOT@">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex disabled
    RewriteEngine On
    RewriteRule ^(?:runtime|\.installer|logs|node|aspx|bin|temp)(?:/|$) - [F,L,NC]
    RewriteRule (^|/)\. - [F,L]
    RewriteRule ^(?:config\.json|web\.config)$ - [F,L,NC]
    RewriteRule ^(?:index\.html)?$ php/rePhotoFrame.php [END,QSA]
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ php/rePhotoFrame.php [END,QSA]
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</Directory>
ServerTokens Prod
ServerSignature Off
