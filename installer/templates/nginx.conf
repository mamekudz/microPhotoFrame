worker_processes 1;
daemon off;
error_log "@ROOT@/logs/nginx-error.log";
pid "@ROOT@/logs/nginx.pid";
events { worker_connections 1024; }
http {
    include "@RUNTIME@/nginx/conf/mime.types";
    types { application/javascript mjs; application/octet-stream ink; }
    access_log "@ROOT@/logs/nginx-access.log";
    client_body_temp_path "@ROOT@/temp/nginx-client";
    fastcgi_temp_path "@ROOT@/temp/nginx-fastcgi";
    server {
        listen @PORT@;
        server_name localhost;
        root "@ROOT@";
        client_max_body_size 500m;
        server_tokens off;
        location ~* ^/(runtime|\.installer|logs|node|aspx|bin|temp)(/|$) { deny all; }
        location ~ /\. { deny all; }
        location ~* ^/(config\.json|web\.config)$ { deny all; }
        location = / { rewrite ^ /php/rePhotoFrame.php last; }
        location = /index.html { rewrite ^ /php/rePhotoFrame.php last; }
        location / { try_files $uri /php/rePhotoFrame.php?$query_string; }
        location = /php/rePhotoFrame.php {
            include "@RUNTIME@/nginx/conf/fastcgi_params";
            fastcgi_param SCRIPT_FILENAME "@ROOT@/php/rePhotoFrame.php";
            fastcgi_pass 127.0.0.1:9089;
            fastcgi_read_timeout 3600;
        }
        location ~ \.php$ { deny all; }
    }
}
