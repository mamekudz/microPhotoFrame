; PlatformIO Project Configuration File for microPhotoFrame
; Based on: https://github.com/pixelEDI/reterminal-e1002-epaper
;
; src_dir is the gulp-mu-build-filter output (npx gulp FIRMWARE_BUILD).
; Do not compile firmware/src directly when switching targets.

[platformio]
src_dir = .generated
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Ports fuer Windows - bitte anpassen falls noetig
upload_port = COM13
monitor_port = COM13
build_flags =
    -D PNG_MAX_BUFFERED_PIXELS=6410
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.8
    bblanchon/ArduinoJson @ ^7.4.2
    bitbank2/PNGdec @ ^1.1.6

[env:neoframe]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM15
monitor_port = COM15
; ESP32-S3R8: 8 MB in-package OPI PSRAM (esptool: Embedded PSRAM 8MB AP_3v3).
; Default board json is "N8 No PSRAM" - without this, 800x480 decode OOMs.
board_build.arduino.memory_type = qio_opi
build_flags =
    -D PNG_MAX_BUFFERED_PIXELS=6410
    -D PHOTOFRAME_NEOFRAME
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    zinggjm/GxEPD2 @ ^1.6.8
    bblanchon/ArduinoJson @ ^7.4.2
    bitbank2/PNGdec @ ^1.1.6
