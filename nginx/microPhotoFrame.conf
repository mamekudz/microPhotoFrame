server {
    listen 890;
    server_name localhost;
    
    # Root directory
    root C:/Projects/microPhotoFrame;

		include mime.types; 
    
    types {
        application/javascript js mjs;
				image/ink ink;
    }
    
    # Increase limits
    client_max_body_size 500M;
    client_body_timeout 3600s;
    
    # Header & Security
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    server_tokens off;

    # --- Rules ---

    # Rule 1a: favicon.ico
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    # Rule 1b: Models directory
    location /models/ {
        access_log off;
    }
    
    # Rule 1c: Static file extensions
    location ~* \.(ink|json|png|jpg|jpeg|gif|svg|css|js|mjs|woff|woff2|ttf|eot|ico|webp|cur|ogg|jp2|appcache)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        access_log off;
    }
    
    # Rule 2 & 3: Main Routing (PHP will serve index.html or handle API)
    location / {
        try_files $uri /php/microPhotoFrame.php$is_args$args;
    }
    
    # Rule 4: PHP handler
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        fastcgi_read_timeout 3600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }
    
    # Security: Deny sensitive files
    location ~ /\.(htaccess|htpasswd|ini|log|sh|sql|bak)$ {
        deny all;
    }
}