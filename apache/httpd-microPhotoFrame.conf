# =========================================
# Apache httpd.conf for microPhotoFrame
# Port 889
# =========================================
# 
# HINWEIS: Diese Datei sollte in die Haupt-httpd.conf eingebunden werden:
# Include "C:/Projects/microPhotoFrame/apache/httpd-microPhotoFrame.conf"
#
# Das PHP-Modul sollte bereits in der Haupt-httpd.conf geladen sein:
# LoadModule php7_module "C:/php7/php7apache2_4.dll"
# PHPIniDir "C:/php7"

# Listen on port 889
Listen 889

# Virtual host for microPhotoFrame
<VirtualHost *:889>
    # Server name
    ServerName localhost
    
    # Document root - adjust path to your microPhotoFrame directory
    DocumentRoot "C:/Projects/microPhotoFrame"
    
    # Directory configuration
    <Directory "C:/Projects/microPhotoFrame">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # CRITICAL: Override DirectoryIndex from main httpd.conf
        # Set DirectoryIndex to empty so Apache doesn't serve index.html automatically
        # Rewrite rules below will handle routing to index.html when appropriate
        # This ensures that requests with query strings are routed to PHP before index.html is served
        # Empty DirectoryIndex forces Apache to check rewrite rules first
        DirectoryIndex ""
        
        # =========================================
        # Rewrite rules - mirrors IIS web.config logic exactly
        # These rules are defined here (not in .htaccess) to ensure they execute
        # BEFORE Apache serves index.html, even if the file exists
        # =========================================
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            
            # CRITICAL: Allow rewriting even if target file exists
            # This ensures that requests with query strings are routed to PHP
            # even if index.html exists
            RewriteOptions InheritBefore
            
            # Rule 1: Static files - serve directly (like IIS Rule 1a, 1b, 1c)
            # Rule 1a: favicon.ico
            RewriteCond %{REQUEST_URI} favicon\.ico$ [NC]
            RewriteRule ^(.*)$ - [L]
            
            # Rule 1b: Files in models directory
            RewriteCond %{REQUEST_URI} /models/ [NC]
            RewriteRule ^(.*)$ - [L]
            
            # Rule 1c: Static file extensions
            RewriteCond %{REQUEST_URI} \.(ink|json|png|jpg|jpeg|gif|svg|css|js|mjs|woff|woff2|ttf|eot|ico|webp|cur)$ [NC]
            RewriteRule ^(.*)$ - [L]
            
            # Rule 2: URLs with query string (?) - rewrite to PHP handler
            # This mirrors IIS Rule 2: "AppAction"
            # Rule 2a: Root URL (/) with query string - route to PHP
            RewriteCond %{QUERY_STRING} .+ [NC]
            RewriteCond %{REQUEST_URI} ^/?$ [NC]
            RewriteRule ^(.*)$ php/microPhotoFrame.php [L,QSA]
            
            # Rule 2b: index.html with query string - route to PHP
            RewriteCond %{QUERY_STRING} .+ [NC]
            RewriteCond %{REQUEST_URI} ^/?index\.html$ [NC]
            RewriteRule ^(.*)$ php/microPhotoFrame.php [L,QSA]
            
            # Rule 2c: Other URLs with query string - route to PHP
            RewriteCond %{QUERY_STRING} .+ [NC]
            RewriteCond %{REQUEST_URI} !^/?$ [NC]
            RewriteCond %{REQUEST_URI} !^/?index\.html$ [NC]
            RewriteCond %{REQUEST_URI} !\.(ink|json|png|jpg|jpeg|gif|svg|css|js|woff|woff2|ttf|eot|ico|webp|cur|mjs)$ [NC]
            RewriteCond %{REQUEST_URI} !^/php/microPhotoFrame\.php [NC]
            RewriteCond %{REQUEST_URI} !^/models/ [NC]
            RewriteCond %{REQUEST_URI} !favicon\.ico$ [NC]
            RewriteRule ^(.*)$ php/microPhotoFrame.php [L,QSA]
            
            # Rule 3: Root URL (/) without query string - route to PHP (PHP will serve index.html)
            # This ensures PHP handles the root URL and can serve index.html
            RewriteCond %{QUERY_STRING} ^$ [NC]
            RewriteCond %{REQUEST_URI} ^/?$ [NC]
            RewriteRule ^(.*)$ php/microPhotoFrame.php [L]
            
            # Rule 4: index.html without query string - route to PHP (PHP will serve index.html)
            RewriteCond %{QUERY_STRING} ^$ [NC]
            RewriteCond %{REQUEST_URI} ^/?index\.html$ [NC]
            RewriteRule ^(.*)$ php/microPhotoFrame.php [L]
            
            # Rule 5: All other URLs without query string - rewrite to index.html (via PHP)
            # This mirrors IIS Rule 3: "AppHTML"
            RewriteCond %{QUERY_STRING} ^$ [NC]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ php/microPhotoFrame.php?route=$1 [L]
        </IfModule>
    </Directory>
    
    # Direct PHP handler for API calls
    <Files "microPhotoFrame.php">
        SetHandler application/x-httpd-php
    </Files>
    
    # PHP configuration (only if mod_php7 is loaded)
    <IfModule mod_php7.c>
        php_value upload_max_filesize 500M
        php_value post_max_size 500M
        php_value max_execution_time 3600
        php_value memory_limit 512M
    </IfModule>
    
    # Error and access logs
    ErrorLog "C:/Apache24/logs/microPhotoFrame_error.log"
    CustomLog "C:/Apache24/logs/microPhotoFrame_access.log" common
    
    # MIME types for JavaScript modules
    AddType application/javascript .mjs
    AddType text/javascript .mjs
    AddType application/javascript .js
    AddType text/javascript .js
</VirtualHost>

